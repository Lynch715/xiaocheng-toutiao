<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eeece5">
<meta name="description" content="从 2000 年起，每周六出版一张地方小报。">
<title>小城头条</title>
<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body class="game">
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span id="progress"><span id="masthead-name"></span><span id="masthead-issue"></span></span></div>
    <div class="workbar">
      <div id="desk-shortcuts" class="desk-shortcuts" hidden>
        <button id="desk-primary" type="button" class="issue"></button>
      </div>
      <nav class="appnav" aria-label="工作区">
        <button type="button" data-view="desk">采编台</button>
        <button type="button" data-view="sales">发行</button>
        <button type="button" data-view="staff">记者</button>
        <button type="button" data-view="finance">财务</button>
        <button type="button" data-view="archive">合订本</button>
        <button type="button" data-view="data">报社数据</button>
        <button type="button" data-view="influence">地图</button>
        <button type="button" data-view="clippings">剪报墙</button>
      </nav>
    </div>
    <div class="appbar-actions">
      <button id="achievements-button" class="soft" type="button" data-action="open-achievements" aria-haspopup="dialog">成就 <strong id="points-total">0 分</strong></button>
      <button id="settings-button" class="soft" type="button" data-action="city" aria-haspopup="dialog">设置</button>
    </div>
  </div>
</header>
<div id="kpi-strip" class="kpi-strip" role="region" aria-label="经营看板"></div>
<main id="app" class="game-main"></main>
<div class="feedback" id="announcer" role="status" aria-atomic="true"></div>
<dialog id="press-dialog" aria-labelledby="press-title"></dialog>
<dialog id="paper-dialog" aria-labelledby="paper-dialog-title">
  <header class="dialog-head">
    <h2 id="paper-dialog-title">头版大样</h2>
    <div class="dialog-actions"><a class="soft export-link" data-download aria-disabled="true">下载头版</a>
      <button class="proof-zoom" type="button" data-action="zoom-proof" aria-pressed="false" aria-controls="paper-viewport">放大</button>
      <button type="button" data-action="close-proof" autofocus>关闭</button></div>
  </header>
  <div id="paper-viewport" class="paper-viewport" tabindex="0" role="region" aria-label="头版阅读区">
    <canvas id="large-proof" role="img" aria-label="头版大样"></canvas>
  </div>
</dialog>
<dialog id="achievements-dialog" aria-labelledby="achievements-title">
  <header class="dialog-head">
    <h2 id="achievements-title">报社成就</h2>
    <button type="button" data-action="close-achievements" autofocus>关闭</button>
  </header>
  <div id="achievement-content" class="achievement-content"></div>
</dialog>
<dialog id="certificate-dialog" aria-labelledby="certificate-title">
  <header class="dialog-head">
    <h2 id="certificate-title">获奖证书</h2>
    <div class="dialog-actions"><a class="soft accent export-link" data-certificate-download aria-disabled="true">下载奖状</a>
      <button type="button" data-action="close-certificate" autofocus>关闭</button></div>
  </header>
  <div id="certificate-content" class="certificate-content"></div>
</dialog>
<dialog id="resume-dialog" aria-labelledby="resume-title">
  <div class="restart-form">
    <h2 id="resume-title">继续上一局</h2>
    <p id="resume-copy"></p>
    <div class="form-actions"><button type="button" data-action="restart">重新开始</button>
      <button type="button" class="issue" data-action="resume" autofocus>继续上一局</button></div>
  </div>
</dialog>
<dialog id="restart-dialog" aria-labelledby="restart-title">
  <form method="dialog" class="restart-form">
    <h2 id="restart-title">重新创刊</h2>
    <p>重新创刊将从第一期办起，现有的发行记录、合订本、成就和积分会清空。</p>
    <div class="form-actions"><button type="submit" value="cancel" autofocus>取消</button>
      <button type="submit" value="restart" class="issue">重新创刊</button></div>
  </form>
</dialog>
<dialog id="city-dialog" aria-labelledby="city-title">
  <form id="city-form" class="restart-form">
    <h2 id="city-title" tabindex="-1" autofocus>给报纸和城市起名</h2>
    <p id="founding-plan">每周六出报，三年共 156 期。每年最后一期编印年终特刊。</p>
    <label class="city-field">报名 <input id="paper-name" autocomplete="off" aria-describedby="paper-name-hint" required></label>
    <small id="paper-name-hint" class="field-hint">最多 18 字，按填写的名称登上报头。</small>
    <label class="city-field">城市名 <input id="city-name" maxlength="8" autocomplete="off" required></label>
    <label class="city-field">总编辑姓名 <input id="editor-name" autocomplete="off" aria-describedby="editor-name-hint"></label>
    <small id="editor-name-hint" class="field-hint">选填，最多 18 字，署名印在头版下方。</small>
    <label class="city-field" id="year-field">创刊年份 <select id="campaign-year" required>
      <option value="2000">2000 年</option><option value="2001">2001 年</option>
    </select></label>
    <fieldset class="paper-stock-field"><legend>报纸底色</legend><div id="paper-stock-options"></div></fieldset>
    <label class="quick-press"><input id="quick-press" type="checkbox"> 快速出刊（跳过动画）</label>
    <span class="form-status" id="city-error" aria-live="polite"></span>
    <div class="form-actions"><button type="button" data-action="close-city">取消</button><button type="submit" id="city-submit" class="issue">创刊</button></div>
  </form>
</dialog>
<dialog id="original-dialog" aria-labelledby="original-title">
  <form id="original-form" class="restart-form">
    <header class="original-header"><h2 id="original-title" tabindex="-1" autofocus>写原创稿</h2></header>
    <div class="original-fields">
      <label class="city-field">栏目 <select id="original-topic"></select></label>
      <label class="city-field">稿件标题 <input id="original-headline" autocomplete="off" required></label>
      <label class="city-field">正文 <textarea id="original-body" rows="8" aria-describedby="original-hint" required></textarea></label>
      <small id="original-hint" class="field-hint">标题最多 28 字，正文最多 420 字、6 段。排为二条、三条时，只印标题和导语。</small>
      <span class="form-status" id="original-error" aria-live="polite"></span>
    </div>
    <div class="form-actions"><button class="soft delete-original" type="button" data-action="delete-original" hidden>删除草稿</button>
      <button type="button" data-action="close-original">取消</button>
      <button type="submit" class="issue">保存草稿</button></div>
  </form>
</dialog>
<input id="cover-file" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" hidden>
<dialog id="risk-dialog" aria-labelledby="risk-title">
  <form method="dialog" class="restart-form">
    <h2 id="risk-title">签发前还有材料待核</h2>
    <p id="risk-copy"></p>
    <div class="form-actions"><button type="submit" value="cancel" autofocus>回到采编台</button>
    <button type="submit" value="publish" class="issue">仍然签发</button></div>
  </form>
</dialog>
<dialog id="reprint-dialog" aria-labelledby="reprint-title">
  <form method="dialog" class="restart-form">
    <h2 id="reprint-title">财务老周来电</h2>
    <p id="reprint-reserve-copy"></p>
    <div class="form-actions"><button type="submit" value="cancel" autofocus>回去改补印单</button>
      <button type="submit" value="confirm" class="issue">照单补印</button></div>
  </form>
</dialog>
<script id="assets">const PAPER_ASSET_URLS = {millennium: '素材/千禧广场.webp', scenes: '素材/临渡资料图.webp', football: '素材/临渡足球场.webp'};</script>
<script src="news.js"></script>
<script src="stories.js"></script>
<script src="editorial.js"></script>
<script src="followups.js"></script>
<script src="pressure.js"></script>
<script src="feedback-config.js"></script>
<script src="street-voices.js"></script>
<script src="reader-mail.js"></script>
<script src="city-benchmark.js"></script>
<script src="issue-feedback.js"></script>
<script src="model.js"></script>
<script src="paper.js"></script>
<script src="feedback-view.js"></script>
<script src="city-map.js"></script>
<script src="dashboard.js"></script>
<script src="save-archive.js"></script>
<script src="newsroom-view.js"></script>
<script src="game.js"></script>
</body>
</html>
